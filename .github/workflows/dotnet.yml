name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WeatherDashboard.sln

      - name: Build
        run: dotnet build WeatherDashboard.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WeatherDashboard.sln --configuration Release --no-build
